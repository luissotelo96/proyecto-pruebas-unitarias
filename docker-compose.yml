services:
  db:
    image: postgres:16-alpine
    container_name: lsc-db
    environment:
      POSTGRES_DB: lsc
      POSTGRES_USER: lsc
      POSTGRES_PASSWORD: lsc
    ports:
      - "5432:5432"
    volumes:
      - lsc-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsc -d lsc"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: lsc-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lsc
      SPRING_DATASOURCE_USERNAME: lsc
      SPRING_DATASOURCE_PASSWORD: lsc
    ports:
      - "8080:8080"

volumes:
  lsc-data:
